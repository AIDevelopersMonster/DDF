    <g fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#a)"><path d="M179 113 L305 113 L305 135 L329 135"/><path d="M275 195 L306 195 L306 159 L329 159"/><path d="M500 147 L562 147"/><path d="M716 147 L782 147"/></g>
    <text x="29" y="255" font-family="DejaVu Sans" font-size="15" fill="#123f5d">Each valid_in=1 advances history; invalid samples are ignored.</text>
    <text x="29" y="282" font-family="DejaVu Sans" font-size="13.5" fill="#476173">Reset clears history, data_out and valid_out. No ready/backpressure.</text>
